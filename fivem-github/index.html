<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>FiveM Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#0c0c0e;--card:#1a1b1f;--card2:#23252a;--tx:#e8e8ea;--mu:#8b8d94;--rd:#e5383b;--gn:#2ecc71;--yl:#f4c430;--gy:#6b7280;--bd:#2c2e34;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh}
#side{width:220px;background:#111215;border-right:1px solid var(--bd);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.logo{font-weight:800;font-size:17px;padding:4px 10px 14px}.logo b{color:var(--rd)}
.nav{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--mu);cursor:pointer;transition:.15s}
.nav:hover{background:var(--card);color:var(--tx)}.nav.on{background:var(--card2);color:#fff;box-shadow:inset 3px 0 var(--rd)}
main{flex:1;min-width:0;padding:18px;max-width:1300px}
h1{margin:0 0 14px;font-size:22px}h3{margin:0 0 10px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat b{font-size:26px;display:block}.stat span{color:var(--mu);font-size:12px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:12px}
button{cursor:pointer;transition:.15s}button:hover{border-color:var(--rd)}
.pri{background:var(--rd);border-color:var(--rd);color:#fff;font-weight:700}.big{padding:14px 22px;font-size:16px}
button:disabled{opacity:.4;cursor:not-allowed}
.bar{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;display:flex}.bar i{display:block;height:100%;transition:width .4s}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid}
.s-todo{color:var(--rd);border-color:var(--rd);background:#e5383b1a}.s-doing{color:var(--yl);border-color:var(--yl);background:#f4c4301a}
.s-done{color:var(--gn);border-color:var(--gn);background:#2ecc711a}.s-blocked{color:#aab;border-color:var(--gy);background:#6b72801a}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{color:var(--mu);font-size:12px;cursor:pointer;white-space:nowrap}.scroll{overflow-x:auto}
.item{border-left:4px solid var(--bd)}.item.todo{border-color:var(--rd)}.item.doing{border-color:var(--yl)}.item.done{border-color:var(--gn)}.item.blocked{border-color:var(--gy)}
.code{font-family:ui-monospace,monospace;background:#0006;padding:1px 6px;border-radius:5px;cursor:copy}
.mu{color:var(--mu)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.modal>div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;width:min(640px,100%);max-height:90vh;overflow:auto}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f label{display:grid;gap:3px;font-size:12px;color:var(--mu)}.f .w{grid-column:1/-1}
#toast{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;z-index:99}
#toast div{background:var(--card2);border-left:4px solid var(--gn);padding:10px 14px;border-radius:8px;animation:in .25s}#toast .e{border-color:var(--rd)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.warn{color:var(--yl)}.bell{position:relative}.bell em{position:absolute;top:-6px;right:-6px;background:var(--rd);border-radius:99px;font-size:10px;padding:0 5px;font-style:normal}
#mb{display:none}
@media(max-width:800px){#side{position:fixed;z-index:40;left:-230px;transition:.2s}#side.open{left:0}#mb{display:inline-block}main{padding:12px}.f{grid-template-columns:1fr}}
</style></head><body>
<nav id="side"><div class="logo">🚗 FiveM <b>Tracker</b></div><div id="nav"></div></nav>
<main><div class="top"><button id="mb" onclick="side.classList.toggle('open')">☰</button><input id="gs" placeholder="Recherche globale…" style="flex:1;min-width:140px"><button class="bell" id="bell" onclick="showNotifs()">🔔<em id="bc" hidden></em></button><span id="me" class="mu"></span></div><div id="v"><p class="mu">Chargement…</p></div></main><div id="toast"></div>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="shim.js"></script>
<script>
const CATS=["Véhicules","Vêtements","Mappings / MLO","Scripts","Armes","Objets","Autres"],ST={todo:"🔴 À faire",doing:"🟡 En cours",done:"🟢 Terminé",blocked:"⚫ Bloqué"},PR=["Basse","Normale","Haute","Urgente"];
const VT=["Sportive","Berline","SUV","Moto","Utilitaire","Autre"];
const NAV=[["dash","📊 Tableau de bord"],["all","📦 Tous les éléments"],["c0","🚗 Véhicules"],["c1","👕 Vêtements"],["c2","🏠 Mappings / MLO"],["c3","📜 Scripts"],["c4","🔫 Armes"],["c5","🧰 Objets"],["imp","⚡ Importation en masse"],["team","👥 Gestion de l'équipe"],["log","🕘 Historique"],["set","⚙️ Paramètres"]];
let db,U,uid,items=[],people={},roles={},logs=[],notifs=[],comments=[],names={},view="dash",page=50,F={q:"",st:"",ow:"",pr:"",sort:"mod",dir:-1,mode:"card",sel:new Set()},IMP=null;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nm=id=>id?(names[id]||"Membre"):"—",now=()=>Date.now(),fd=t=>t?new Date(t).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}):"—";
const rid=()=>Math.random().toString(36).slice(2,10)+now().toString(36).slice(-4);
const role=()=>U.canAdmin?"admin":(roles[uid]||"member"),isA=()=>role()==="admin",isL=()=>role()!=="member";
const canEdit=i=>isL()||!i.owner||i.owner===uid;
function toast(m,e){const d=document.createElement("div");d.textContent=m;if(e)d.className="e";$("#toast").append(d);setTimeout(()=>d.remove(),3500)}
async function lg(action,detail,itemId){try{await db.doc("log/"+rid()).set({by:uid,action,detail:detail||"",itemId:itemId||"",at:now()})}catch(e){}}
async function notify(to,text,itemId){if(!to||to===uid)return;try{await db.doc("notifs/"+rid()).set({to,text,itemId:itemId||"",at:now(),read:false})}catch(e){}}
async function init(){
 const cl=window.claude;if(!cl){$("#v").innerHTML="<p>Erreur de chargement.</p>";return}
 const user=await cl.use("user");db=await cl.use("db");
 if(!db||!user){$("#v").innerHTML="<p>Connexion au serveur impossible.</p>";return}
 uid=await user.id();U={canAdmin:!!(await user.canEdit()),prof:user.profiles};
 db.doc("people/"+uid).set({id:uid,joined:now()}).catch(()=>{});
 const sub=(p,fn)=>db.collection(p).onSnapshot(s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));draw()},e=>toast("Erreur de synchronisation : "+(e.message||e.code),1));
 sub("items",a=>items=a);sub("people",a=>{people=Object.fromEntries(a.map(x=>[x.id,x]));resolve()});
 sub("roles",a=>roles=Object.fromEntries(a.map(x=>[x.id,x.role])));sub("comments",a=>comments=a);
 sub("log",a=>logs=a.sort((x,y)=>y.at-x.at).slice(0,500));sub("notifs",a=>notifs=a.filter(n=>n.to===uid).sort((x,y)=>y.at-x.at));
}
async function resolve(){const ids=Object.keys(people);try{const p=await U.prof(ids);for(const i of ids)names[i]=p[i]?.name||"Membre"}catch(e){}draw()}
function setView(v){view=v;page=50;F.sel.clear();side.classList.remove("open");draw()}
function draw(){
 if(!db)return;$("#nav").innerHTML=NAV.map(([k,l])=>`<div class="nav ${view===k?"on":""}" onclick="setView('${k}')">${l}</div>`).join("");
 $("#me").textContent=nm(uid)+" · "+{admin:"Admin",lead:"Responsable",member:"Membre"}[role()];
 const u=notifs.filter(n=>!n.read).length;$("#bc").hidden=!u;$("#bc").textContent=u;
 if($("#gs").value!==F.q&&document.activeElement!==$("#gs"))$("#gs").value=F.q;
 if(document.activeElement&&["TEXTAREA"].includes(document.activeElement.tagName)&&view==="imp")return;
 const fn={dash,all:()=>list(),imp,team,log:hist,set}[view]||(()=>list(+view.slice(1)));$("#v").innerHTML=fn();
}
$("#gs").oninput=e=>{F.q=e.target.value;if(!["all"].includes(view)&&!/^c\d/.test(view))view="all";page=50;draw();$("#gs").focus()};
const pct=a=>a.length?Math.round(a.filter(i=>i.status==="done").length/a.length*100):0;
function dash(){
 const c=s=>items.filter(i=>i.status===s).length,t=items.length,w=s=>t?c(s)/t*100:0;
 const wk={};items.forEach(i=>{const d=new Date(i.added||0);d.setDate(d.getDate()-((d.getDay()+6)%7));const k=d.toISOString().slice(5,10);wk[k]=(wk[k]||0)+1});
 const wks=Object.entries(wk).sort().slice(-8),mx=Math.max(1,...wks.map(x=>x[1]));
 const byC=CATS.map(x=>[x,items.filter(i=>i.cat===x).length]),mc=Math.max(1,...byC.map(x=>x[1]));
 const byM={};items.filter(i=>i.status==="done").forEach(i=>{if(i.owner)byM[i.owner]=(byM[i.owner]||0)+1});const bm=Object.entries(byM).sort((a,b)=>b[1]-a[1]).slice(0,8),mm=Math.max(1,...bm.map(x=>x[1]));
 const bars=(r,m)=>r.map(([k,v])=>`<div class="row" style="margin:5px 0"><span style="width:110px" class="mu">${esc(k)}</span><div class="bar sp"><i style="width:${v/m*100}%;background:var(--rd)"></i></div><b>${v}</b></div>`).join("")||'<p class="mu">Aucune donnée.</p>';
 return `<h1>Tableau de bord</h1><div class="grid">${[["Total",t,""],["À faire",c("todo"),"var(--rd)"],["En cours",c("doing"),"var(--yl)"],["Terminés",c("done"),"var(--gn)"],["Bloqués",c("blocked"),"var(--gy)"],["Avancement",pct(items)+"%","#fff"]].map(([l,v,col])=>`<div class="card stat"><b style="color:${col}">${v}</b><span>${l}</span></div>`).join("")}</div>
 <div class="card" style="margin:12px 0"><div class="row"><b>Progression globale</b><span class="sp"></span><b>${pct(items)}%</b></div><div class="bar" style="margin-top:8px"><i style="width:${w("done")}%;background:var(--gn)"></i><i style="width:${w("doing")}%;background:var(--yl)"></i><i style="width:${w("blocked")}%;background:var(--gy)"></i><i style="width:${w("todo")}%;background:var(--rd)"></i></div></div>
 <div class="grid g2"><div class="card"><h3>Éléments ajoutés par semaine</h3>${bars(wks.map(([k,v])=>["Sem. "+k,v]),mx)}</div><div class="card"><h3>Répartition par catégorie</h3>${bars(byC,mc)}</div>
 <div class="card"><h3>Travail terminé par membre</h3>${bars(bm.map(([k,v])=>[nm(k),v]),mm)}</div>
 <div class="card"><h3>Activité récente</h3>${logs.slice(0,8).map(l=>`<div style="margin:5px 0"><b>${esc(nm(l.by))}</b> ${esc(l.action)} <span class="mu">${esc(l.detail)} · ${fd(l.at)}</span></div>`).join("")||'<p class="mu">Rien pour le moment.</p>'}</div></div>
 <div class="card" style="margin-top:12px"><h3>Derniers éléments ajoutés</h3>${[...items].sort((a,b)=>b.added-a.added).slice(0,6).map(i=>`<div class="row" style="margin:5px 0"><a onclick="openItem('${i.id}')" style="cursor:pointer"><b>${esc(i.name)}</b></a><span class="mu">${esc(i.cat)}</span><span class="sp"></span>${badge(i)}</div>`).join("")||'<p class="mu">Aucun élément. Utilisez l\'importation en masse pour démarrer.</p>'}</div>`}
const badge=i=>`<span class="badge s-${i.status}" title="Cliquer pour changer" onclick="event.stopPropagation();cycle('${i.id}')">${ST[i.status]}</span>`;
function filtered(ci){let a=items.filter(i=>(ci==null||i.cat===CATS[ci])&&(!F.st||i.status===F.st)&&(!F.ow||i.owner===F.ow)&&(!F.pr||i.prio==F.pr));
 const q=F.q.trim().toLowerCase();if(q)a=a.filter(i=>(i.name+" "+i.brand+" "+i.spawn+" "+i.desc).toLowerCase().includes(q));
 return a.sort((x,y)=>{let p=x[F.sort],q=y[F.sort];if(typeof p==="string")return F.dir*p.localeCompare(q||"");return F.dir*((p||0)-(q||0))})}
function list(ci){
 const a=filtered(ci),sh=a.slice(0,page),sels=F.sel.size;
 return `<h1>${ci==null?"Tous les éléments":CATS[ci]} <span class="mu">(${a.length})</span></h1>
 <div class="row" style="margin-bottom:12px"><select onchange="F.st=this.value;page=50;draw()"><option value="">Tous statuts</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${F.st===k?"selected":""}>${v}</option>`).join("")}</select>
 <select onchange="F.ow=this.value;draw()"><option value="">Tous responsables</option>${Object.keys(people).map(p=>`<option value="${p}" ${F.ow===p?"selected":""}>${esc(nm(p))}</option>`).join("")}</select>
 <select onchange="F.pr=this.value;draw()"><option value="">Toutes priorités</option>${PR.map((p,i)=>`<option value="${i}" ${F.pr==i&&F.pr!==""?"selected":""}>${p}</option>`).join("")}</select>
 <select onchange="F.sort=this.value;draw()">${[["mod","Modification"],["added","Date d'ajout"],["name","Nom"],["status","Statut"],["prio","Priorité"]].map(([k,v])=>`<option value="${k}" ${F.sort===k?"selected":""}>Tri : ${v}</option>`).join("")}</select>
 <button onclick="F.dir*=-1;draw()">${F.dir>0?"↑":"↓"}</button><button onclick="F.mode=F.mode==='card'?'table':'card';draw()">${F.mode==="card"?"▤ Tableau":"▦ Cartes"}</button><span class="sp"></span>
 ${isL()?`<button class="pri" onclick="editItem(null,${ci??"null"})">+ Ajouter</button>`:""}</div>
 ${sels?bulkBar():`<div class="mu" style="margin-bottom:8px"><label><input type="checkbox" onchange="selAll(this.checked,'${a.slice(0,page).map(i=>i.id).join(",")}')"> Tout sélectionner (page affichée)</label></div>`}
 ${F.mode==="card"?`<div class="grid g2">${sh.map(card).join("")}</div>`:`<div class="card scroll"><table><tr><th></th><th>Nom</th><th>Catégorie</th><th>Spawn</th><th>Statut</th><th>Resp.</th><th>Priorité</th><th>Modifié</th></tr>${sh.map(i=>`<tr><td><input type="checkbox" ${F.sel.has(i.id)?"checked":""} onchange="sel('${i.id}',this.checked)"></td><td><a style="cursor:pointer" onclick="openItem('${i.id}')">${esc(i.name)}</a></td><td>${esc(i.cat)}</td><td>${i.spawn?`<span class="code" onclick="cp('${esc(i.spawn)}')">${esc(i.spawn)}</span>`:""}</td><td>${badge(i)}</td><td>${esc(nm(i.owner))}</td><td>${PR[i.prio||1]}</td><td class="mu">${fd(i.mod)}</td></tr>`).join("")}</table></div>`}
 ${!a.length?'<p class="mu">Aucun élément.</p>':""}${a.length>page?`<p><button onclick="page+=100;draw()">Charger plus (${a.length-page} restants)</button></p>`:""}`}
const card=i=>`<div class="card item ${i.status}"><div class="row"><input type="checkbox" ${F.sel.has(i.id)?"checked":""} onchange="sel('${i.id}',this.checked)"><b style="cursor:pointer" onclick="openItem('${i.id}')">${esc(i.name)}</b><span class="sp"></span>${badge(i)}</div>
<div class="mu" style="margin:6px 0">${esc(i.cat)}${i.sub?" · "+esc(i.sub):""}${i.brand?" · "+esc(i.brand):""} · ${PR[i.prio||1]}</div>${i.desc?`<div class="mu" style="margin:0 0 6px;font-size:12px">${esc(i.desc.slice(0,140))}</div>`:""}<div class="row">${i.spawn?`<span class="code" onclick="cp('${esc(i.spawn)}')" title="Copier">${esc(i.spawn)}</span>`:""}<span class="sp"></span><span class="mu">👤 ${esc(nm(i.owner))}</span></div>${i.img?`<img src="${esc(i.img)}" alt="" style="max-width:100%;max-height:120px;margin-top:8px;border-radius:8px" onerror="this.remove()">`:""}</div>`;
function cp(t){navigator.clipboard.writeText(t).then(()=>toast("Copié : "+t),()=>toast("Copie impossible",1))}
function sel(id,on){on?F.sel.add(id):F.sel.delete(id);draw()}function selAll(on,ids){ids.split(",").filter(Boolean).forEach(i=>on?F.sel.add(i):F.sel.delete(i));draw()}
function bulkBar(){const l=isL();return `<div class="card row" style="margin-bottom:10px;border-color:var(--rd)"><b>${F.sel.size} sélectionné(s)</b>
 <select id="bs" onchange="bulk('status',this.value)"><option value="">Statut…</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
 ${l?`<select onchange="bulk('owner',this.value)"><option value="">Responsable…</option>${Object.keys(people).map(p=>`<option value="${p}">${esc(nm(p))}</option>`).join("")}</select>
 <select onchange="bulk('cat',this.value)"><option value="">Catégorie…</option>${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
 <select onchange="bulk('prio',this.value)"><option value="">Priorité…</option>${PR.map((p,i)=>`<option value="${i}">${p}</option>`).join("")}</select>`:""}
 ${isA()?`<button onclick="bulkDel()">🗑 Supprimer</button>`:""}<button onclick="F.sel.clear();draw()">Annuler</button></div>`}
async function par(arr,fn,n=25){for(let i=0;i<arr.length;i+=n)await Promise.all(arr.slice(i,i+n).map(fn))}
async function bulk(k,v){if(v==="")return;const ids=[...F.sel],set=items.filter(i=>ids.includes(i.id)&&canEdit(i));if(k==="prio"||k==="status"||k==="owner"||k==="cat"){}
 try{await par(set,i=>db.doc("items/"+i.id).update({[k]:k==="prio"?+v:v,mod:now()}));await lg("modification en masse",`${set.length} éléments · ${k} → ${k==="status"?ST[v]:k==="owner"?nm(v):v}`);
 if(k==="owner")set.forEach(i=>notify(v,"Un élément vous a été attribué : "+i.name,i.id));
 toast(set.length+" élément(s) modifié(s)");F.sel.clear()}catch(e){toast("Erreur : "+(e.message||e.code),1)}}
async function bulkDel(){if(!isA())return;if(!confirm(`Supprimer définitivement ${F.sel.size} élément(s) ?`))return;const ids=[...F.sel];
 try{await par(ids,id=>db.doc("items/"+id).delete());await lg("suppression en masse",ids.length+" éléments");toast("Supprimés : "+ids.length);F.sel.clear()}catch(e){toast("Erreur : "+(e.message||e.code),1)}}
const KEYS=Object.keys(ST);
async function cycle(id){const i=items.find(x=>x.id===id);if(!i||!canEdit(i))return toast("Non autorisé",1);const n=KEYS[(KEYS.indexOf(i.status)+1)%4];await setStatus(i,n)}
async function setStatus(i,n){try{await db.doc("items/"+i.id).update({status:n,mod:now()});await lg("statut modifié",`${i.name} : ${ST[i.status]} → ${ST[n]}`,i.id);
 if(i.owner)notify(i.owner,`${i.name} est passé à « ${ST[n]} »`,i.id);if(n==="done"||n==="blocked")Object.keys(roles).filter(r=>roles[r]==="admin").forEach(a=>notify(a,`${i.name} : ${ST[n]}`,i.id))}catch(e){toast("Erreur : "+(e.message||e.code),1)}}
function editItem(id,ci){const i=id?items.find(x=>x.id===id):{cat:ci!=null?CATS[ci]:CATS[0],status:"todo",prio:1};
 modal(`<h3>${id?"Modifier":"Nouvel élément"}</h3><div class="f" id="ef"><label class="w">Nom<input name="name" value="${esc(i.name)}"></label><label>Catégorie<select name="cat">${CATS.map(c=>`<option ${i.cat===c?"selected":""}>${c}</option>`).join("")}</select></label><label>Type<input name="sub" value="${esc(i.sub)}" list="vt"></label><datalist id="vt">${VT.map(v=>`<option>${v}</option>`).join("")}</datalist>
 <label>Marque<input name="brand" value="${esc(i.brand)}"></label><label>Code de spawn<input name="spawn" value="${esc(i.spawn)}"></label><label>Statut<select name="status">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${i.status===k?"selected":""}>${v}</option>`).join("")}</select></label>
 <label>Priorité<select name="prio">${PR.map((p,k)=>`<option value="${k}" ${(i.prio??1)==k?"selected":""}>${p}</option>`).join("")}</select></label><label>Responsable<select name="owner"><option value="">—</option>${Object.keys(people).map(p=>`<option value="${p}" ${i.owner===p?"selected":""}>${esc(nm(p))}</option>`).join("")}</select></label>
 <label>URL image (facultatif)<input name="img" value="${esc(i.img)}"></label><label class="w">Description<textarea name="desc" rows="2">${esc(i.desc)}</textarea></label><label class="w">Notes internes<textarea name="notes" rows="2">${esc(i.notes)}</textarea></label></div>
 <div class="row" style="margin-top:12px"><button class="pri" onclick="saveItem('${id||""}')">Enregistrer</button><button onclick="closeM()">Annuler</button></div>`)}
async function saveItem(id){const d={};document.querySelectorAll("#ef [name]").forEach(e=>d[e.name]=e.value.trim());if(!d.name)return toast("Le nom est obligatoire",1);if(d.img&&!/^https?:\/\//i.test(d.img))return toast("URL d'image invalide",1);
 d.prio=+d.prio;const old=id?items.find(x=>x.id===id):null;try{if(old){if(!canEdit(old))return toast("Non autorisé",1);await db.doc("items/"+id).update({...d,mod:now()});await lg("élément modifié",d.name,id);
 if(d.owner&&d.owner!==old.owner)notify(d.owner,"Un élément vous a été attribué : "+d.name,id);if(d.status!==old.status&&old.owner)notify(old.owner,`${d.name} : ${ST[d.status]}`,id)}
 else{const n=rid();await db.doc("items/"+n).set({...d,added:now(),mod:now(),by:uid});await lg("élément ajouté",d.name,n);if(d.owner)notify(d.owner,"Un élément vous a été attribué : "+d.name,n)}

function openItem(id){const i=items.find(x=>x.id===id);if(!i)return;const cs=comments.filter(c=>c.itemId===id).sort((a,b)=>a.at-b.at),h=logs.filter(l=>l.itemId===id).slice(0,10);
 const cm=c=>`<div style="margin:6px 0;${c.parent?"margin-left:22px":""}"><b>${esc(nm(c.by))}</b> <span class="mu">${fd(c.at)}</span> <a class="mu" style="cursor:pointer" onclick="reply('${c.parent||c.id}')">répondre</a><div>${esc(c.text)}</div></div>`;

 <div class="row" style="margin:10px 0">${canEdit(i)?`<button onclick="editItem('${id}')">✏️ Modifier</button>`:""}${isL()?`<button onclick="dup('${id}')">⧉ Dupliquer</button>`:""}${isA()?`<button onclick="delItem('${id}')">🗑 Supprimer</button>`:""}<button onclick="closeM()">Fermer</button></div>
 <h3>Commentaires</h3><div>${cs.map(cm).join("")||'<p class="mu">Aucun commentaire.</p>'}</div><div class="row"><input id="ct" class="sp" placeholder="Votre message…"><button class="pri" onclick="addC('${id}')">Envoyer</button></div>

let RP="";function reply(p){RP=p;$("#ct").focus();$("#ct").placeholder="Réponse…"}

function showNotifs(){modal(`<h3>Notifications</h3>${notifs.slice(0,30).map(n=>`<div style="margin:6px 0;${n.read?"opacity:.5":""}">${esc(n.text)} <span class="mu">${fd(n.at)}</span></div>`).join("")||'<p class="mu">Aucune.</p>'}<button onclick="readAll()">Tout marquer comme lu</button> <button onclick="closeM()">Fermer</button>`)}

/* ===== IMPORT ===== */
const MAP={name:["name","label","displayname","title","nom"],spawn:["model","spawn","spawnname","spawncode","code","hash","vehicle"],brand:["brand","make","manufacturer","marque"],sub:["category","class","type","categorie","vehicletype","souscategorie"],cat:["rubrique","maincat","maincategory"],desc:["description","desc","descriptif"],prio:["importance","priority","priorite","prio"]};
const GEN=/^(config|vehicles?|cars?|list|data|items?|shared|locales?|cfg)$/i;
function norm(o){const r={name:"",spawn:"",brand:"",sub:"",cat:"",desc:"",prio:""},L={};for(const k in o)L[k.toLowerCase().replace(/[^a-z]/g,"")]=String(o[k]??"").trim();
 for(const f in MAP)for(const k of MAP[f])if(L[k]){r[f]=L[k];break}
 r.cat=CATS.find(c=>c.toLowerCase()===r.cat.toLowerCase())||"";const pi=PR.findIndex(p=>p.toLowerCase()===r.prio.toLowerCase());r.prio=pi<0?"":pi;return r}
function parseCSV(t){const ls=t.split(/\r?\n/).filter(l=>l.trim()),sep=[";","\t",","].find(s=>ls[0].includes(s));if(!sep||ls.length<2)return null;
 const sp=l=>{const o=[];let c="",q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===sep&&!q){o.push(c);c=""}else c+=ch}o.push(c);return o.map(x=>x.trim())};
 const h=sp(ls[0]).map(x=>x.toLowerCase().replace(/[^a-z]/g,""));if(!h.some(x=>[...MAP.name,...MAP.spawn].includes(x)))return null;
 return ls.slice(1).map(l=>{const c=sp(l),o={};h.forEach((k,i)=>o[k]=c[i]);return norm(o)})}
function fromJSON(j,out,key){if(Array.isArray(j)){j.forEach(x=>{if(x&&typeof x==="object")fromJSON(x,out);else if(typeof x==="string")out.push({name:x,spawn:x,brand:"",sub:""})});return}
 if(j&&typeof j==="object"){const n=norm(j);if(n.name||n.spawn){if(!n.spawn&&key&&!GEN.test(key))n.spawn=key;out.push(n);return}for(const k in j)fromJSON(j[k],out,k)}}
function parseLua(t){const out=[],t2=t.replace(/--\[\[[\s\S]*?\]\]/g,"").replace(/--.*$/gm,""),re=/(?:\[\s*["']([^"']+)["']\s*\]|([A-Za-z_]\w*))?\s*=?\s*\{([^{}]*)\}/g;let m,found=false;
 while((m=re.exec(t2))){const f={},fr=/([A-Za-z_]\w*)\s*=\s*(?:"([^"]*)"|'([^']*)')/g;let x;while((x=fr.exec(m[3])))f[x[1]]=x[2]??x[3];const n=norm(f),key=m[1]||m[2];
  if(!n.name&&!n.spawn)continue;if(!n.spawn&&key&&!GEN.test(key))n.spawn=key;out.push(n);found=true}
 if(found)return out;
 for(const l of t2.split(/\r?\n/)){const k=l.match(/^\s*\[?\s*["']?([\w\-\.]+)["']?\s*\]?\s*=\s*["']([^"']+)["']\s*,?\s*$/);if(k&&!GEN.test(k[1]))out.push({spawn:k[1],name:k[2],brand:"",sub:""})}
 return out}
function parseLines(t){const out=[];for(let l of t.split(/\r?\n/)){l=l.replace(/--.*$|\/\/.*$|^#.*$/,"").trim().replace(/^[-*•\d.)\s]+(?=\S)/,"").replace(/[,;]$/,"").replace(/^["']|["']$/g,"");if(!l||/^[{}\[\]()]+$/.test(l))continue;
  const p=l.split(/\s*[;\t|]\s*|\s+[-–:=]\s+|,\s*/).map(s=>s.replace(/^["']|["']$/g,"").trim()).filter(Boolean);
  if(p.length>=2)out.push({name:p[0],spawn:p[1],brand:"",sub:p[2]||""});else if(/^[\w\-\.]+$/.test(l))out.push({name:l,spawn:l,brand:"",sub:""});else out.push({name:l,spawn:"",brand:"",sub:"",review:"Format non reconnu"})}return out}
function analyse(t){t=t.trim();if(!t)return[];let r=null;
 if(/^[\[{]/.test(t)){try{r=[];fromJSON(JSON.parse(t),r)}catch(e){r=null}}
 if(!r)r=parseCSV(t);if(!r&&/[{}]|=/.test(t)){const l=parseLua(t);if(l.length)r=l}if(!r||!r.length)r=parseLines(t);return r}
function imp(){const rows=IMP?.rows;
 return `<h1>Importation en masse</h1>${!isA()?'<div class="card warn">L\'importation est réservée aux administrateurs.</div>':`
 <div class="card"><p class="mu">Collez un script Lua, du JSON, du CSV ou une liste. Le contenu est analysé comme du texte, jamais exécuté. Formats : tables Lua, JSON, CSV, listes simples. Aucune information n'est inventée.</p>
 <textarea id="ta" rows="9" placeholder="Collez ici…">${esc(IMP?.text||"")}</textarea><div class="row" style="margin-top:8px"><button class="pri" onclick="runA()">🔍 Analyser</button><label class="btn mu">ou fichier (.lua .json .csv .txt) <input type="file" accept=".lua,.json,.csv,.txt" onchange="loadF(this.files[0])"></label></div></div>
 ${rows?impTable(rows):""}`}`}
function loadF(f){if(!f)return;if(f.size>10e6)return toast("Fichier trop volumineux (10 Mo max)",1);const r=new FileReader();r.onload=()=>{$("#ta").value=r.result;runA()};r.readAsText(f)}
function runA(){const text=$("#ta").value;const k=s=>(s||"").toLowerCase().trim();const ex=new Set(items.map(i=>k(i.spawn)||"n:"+k(i.name)));const seen=new Set();
 const rows=analyse(text).slice(0,5000).map((r,n)=>{const key=k(r.spawn)||"n:"+k(r.name);let flag="";if(r.review)flag="review";else if(!r.name||!r.spawn)flag="review";if(ex.has(key))flag="exist";else if(seen.has(key))flag="dup";seen.add(key);return{...r,n,flag,keep:flag===""||flag==="review"}});
 IMP={text,rows,cat:"Scripts",status:"todo",owner:"",mode:"new"};draw()}
function impTable(rows){const c=s=>rows.filter(r=>r.flag===s).length,nw=rows.filter(r=>!r.flag).length;
 return `<div class="card" style="margin-top:12px"><div class="row"><b>${rows.length} entrées</b><span class="s-done badge">${nw} nouvelles</span><span class="badge s-doing">${c("review")} à vérifier</span><span class="badge s-blocked">${c("exist")} existantes</span><span class="badge s-blocked">${c("dup")} doublons dans le texte</span></div>
 <div class="row" style="margin:10px 0"><select title="Rubrique par défaut si non précisée" onchange="IMP.cat=this.value">${CATS.map(x=>`<option ${IMP.cat===x?"selected":""}>${x}</option>`).join("")}</select><select onchange="IMP.status=this.value">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${IMP.status===k?"selected":""}>${v}</option>`).join("")}</select>
 <select onchange="IMP.owner=this.value"><option value="">Responsable…</option>${Object.keys(people).map(p=>`<option value="${p}">${esc(nm(p))}</option>`).join("")}</select>
 <select onchange="IMP.mode=this.value"><option value="new">Importer uniquement les nouveaux</option><option value="update" ${IMP.mode==="update"?"selected":""}>Mettre à jour les existants (confirmation)</option></select>
 <button onclick="IMP.rows.forEach(r=>{if(r.flag!=='exist'&&r.flag!=='dup')r.keep=true});draw()">Tout cocher</button><button onclick="IMP.rows=IMP.rows.filter(r=>r.keep);draw()">Supprimer les décochés</button></div>
 <div class="scroll" style="max-height:420px;overflow:auto"><table><tr><th></th><th>Nom</th><th>Spawn code</th><th>Marque</th><th>Type</th><th>Description</th><th>Rubrique</th><th>Importance</th><th>Statut</th></tr>${rows.slice(0,300).map(r=>`<tr><td><input type="checkbox" ${r.keep?"checked":""} onchange="IMP.rows[${rows.indexOf(r)}].keep=this.checked"></td>
 ${["name","spawn","brand","sub","desc"].map(f=>`<td><input value="${esc(r[f])}" style="width:100%;min-width:90px" onchange="IMP.rows[${rows.indexOf(r)}].${f}=this.value.trim()"></td>`).join("")}<td><select onchange="IMP.rows[${rows.indexOf(r)}].cat=this.value"><option value="">Par défaut</option>${CATS.map(c=>`<option ${r.cat===c?"selected":""}>${c}</option>`).join("")}</select></td><td><select onchange="IMP.rows[${rows.indexOf(r)}].prio=+this.value">${PR.map((p,i)=>`<option value="${i}" ${(r.prio===""||r.prio==null?1:r.prio)===i?"selected":""}>${p}</option>`).join("")}</select></td><td>${{"":"🆕 Nouveau",review:'<span class="warn">⚠ À vérifier</span>',exist:"Existe déjà",dup:"Doublon"}[r.flag]}</td></tr>`).join("")}</table></div>
 ${rows.length>300?`<p class="mu">Aperçu des 300 premières lignes (les ${rows.length} seront traitées).</p>`:""}
 <p><button class="pri big" onclick="doImport()">IMPORTER TOUS LES ÉLÉMENTS</button></p></div>`}
async function doImport(){if(!isA())return;const rows=IMP.rows.filter(r=>(r.keep||(IMP.mode==="update"&&r.flag==="exist"))&&(r.name||r.spawn)),k=s=>(s||"").toLowerCase().trim(),bySp=new Map(items.map(i=>[k(i.spawn)||"n:"+k(i.name),i]));
 const nw=rows.filter(r=>!bySp.has(k(r.spawn)||"n:"+k(r.name))),old=rows.filter(r=>bySp.has(k(r.spawn)||"n:"+k(r.name))),skipped=IMP.rows.filter(r=>r.flag==="exist"||r.flag==="dup").length;
 let upd=IMP.mode==="update"&&old.length&&confirm(`Mettre à jour ${old.length} fiche(s) existante(s) ? (nom, marque et type seulement, le statut est conservé)`)?old:[],errs=0;
 if(!nw.length&&!upd.length)return toast("Rien à importer",1);const btn=document.querySelector(".big");btn.disabled=true;let done=0;
 const ids=new Set(items.map(i=>i.id));
 const task=async r=>{try{if(bySp.has(k(r.spawn)||"n:"+k(r.name))&&upd.includes(r)){const o=bySp.get(k(r.spawn)||"n:"+k(r.name)),u={mod:now()};["name","brand","sub","desc"].forEach(f=>{if(r[f])u[f]=r[f]});if(r.prio!==""&&r.prio!=null)u.prio=+r.prio;if(r.cat)u.cat=r.cat;await db.doc("items/"+o.id).update(u)}
  else await db.doc("items/"+rid()).set({name:r.name||r.spawn,spawn:r.spawn||"",brand:r.brand||"",sub:r.sub||"",cat:r.cat||IMP.cat,status:IMP.status,prio:(r.prio===""||r.prio==null?1:+r.prio),owner:IMP.owner,desc:r.desc||"",notes:"",img:"",added:now(),mod:now(),by:uid})}catch(e){errs++}done++;if(done%50===0)btn.textContent=`Import… ${done}/${nw.length+upd.length}`};
 await par([...nw,...upd],task,20);await lg("import en masse",`${nw.length} créés, ${upd.length} mis à jour, ${skipped} ignorés, ${errs} erreurs · ${IMP.cat}`);
 const rev=IMP.rows.filter(r=>r.flag==="review").length;if(IMP.owner)notify(IMP.owner,`${nw.length} éléments vous ont été attribués (import)`);
 modal(`<h3>Importation terminée</h3><p>✅ Importés : <b>${nw.length-errs<0?0:nw.length}</b><br>🔄 Mis à jour : <b>${upd.length}</b><br>⏭ Doublons ignorés : <b>${skipped}</b><br>❌ Erreurs : <b>${errs}</b><br>⚠ À vérifier : <b>${rev}</b></p><button class="pri" onclick="closeM();IMP=null;setView('all')">Voir les éléments</button>`);IMP=null}
